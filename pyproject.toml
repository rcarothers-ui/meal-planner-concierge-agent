[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planner-concierge-agent"
version = "1.0.0"
description = "Production-Grade Automated Meal Planning Concierge Multi-Agent System built with Google ADK, Vertex AI, OpenTelemetry, Cloud DLP, and Terraform IaC."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "rcarothers", email = "rcarothers@google.com"}
]
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-trace>=1.13.0",
    "google-cloud-dlp>=3.21.0",
    "google-cloud-firestore>=2.16.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = ["test_*.py", "evaluate_*.py"]
asyncio_mode = "auto"
